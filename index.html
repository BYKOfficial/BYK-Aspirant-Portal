<!DOCTYPE html>
<html lang="en" id="html-root" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BYK All Exam — Elite Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --bg: #0B0F19; --glass-bg: rgba(17, 24, 39, 0.7); --border: rgba(255, 255, 255, 0.1); --accent: #6366F1; }
  body { background-color: var(--bg); color: #F8FAFC; font-family: sans-serif; }
  .glass-panel { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 1.25rem; }
</style>
</head>
<body class="flex min-h-screen">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-64 border-r border-white/10 p-6 flex flex-col">
    <div class="font-bold text-xl mb-10">BYK<span class="text-indigo-400">Exam</span></div>
    <nav class="space-y-4 text-gray-400">
      <div class="cursor-pointer hover:text-white">🏠 Dashboard</div>
      <div class="cursor-pointer hover:text-white">⚡ Mock Tests</div>
      <div class="cursor-pointer hover:text-white">🤖 AI Evaluator</div>
    </nav>
  </aside>

  <!-- Content -->
  <div class="flex-1">
    <header class="p-6 flex justify-between items-center border-b border-white/10">
      <h2 class="text-xl font-bold">Dashboard</h2>
      <button id="login-btn" onclick="handleAuth()" class="bg-indigo-600 px-4 py-2 rounded-lg font-bold">Login with Google</button>
    </header>
    
    <main class="p-8">
      <div class="glass-panel p-12 text-center">
        <h1 class="text-5xl font-black mb-6">Stop Scanning.<br/><span class="text-indigo-400">Start Scoring.</span></h1>
        <p class="text-gray-400">Welcome to your elite dashboard. Login to access tests.</p>
      </div>
    </main>
  </div>

  <!-- Firebase Auth -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDt57DdiTxlLIHK0vkl5IwW1RL9o3DUe3k",
      authDomain: "byk-all-exam.firebaseapp.com",
      projectId: "byk-all-exam",
      storageBucket: "byk-all-exam.firebasestorage.app",
      messagingSenderId: "413565314858",
      appId: "1:413565314858:web:c614e57ed60c47a5b32053"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.handleAuth = () => {
      signInWithPopup(auth, provider)
        .then((result) => {
          document.getElementById('login-btn').innerText = "Logged In";
          alert("Welcome " + result.user.displayName + "!");
        })
        .catch((e) => alert("Error: " + e.message));
    };
  </script>
</body>
</html>
