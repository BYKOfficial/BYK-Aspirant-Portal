<!-- Header mein login button aur script mein logic add kiya gaya hai -->
<header class="h-14 px-4 sm:px-6 flex items-center justify-between">
    <div class="flex items-center gap-3">
        <!-- ... (Aapka existing header code) ... -->
    </div>
    <div class="flex items-center gap-3">
        <!-- Yahan naya Login Button add kiya hai -->
        <button id="login-btn" onclick="handleAuth()" class="btn-primary px-4 py-1.5 text-sm">
            Login
        </button>
        <!-- ... (Aapka existing theme toggle) ... -->
    </div>
</header>

<!-- Firebase Script (Ise file ke ant mein add karein) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDt57DdiTxlLIHK0vkl5IwW1RL9o3DUe3k",
    authDomain: "byk-all-exam.firebaseapp.com",
    projectId: "byk-all-exam",
    storageBucket: "byk-all-exam.firebasestorage.app",
    messagingSenderId: "413565314858",
    appId: "1:413565314858:web:c614e57ed60c47a5b32053"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  window.handleAuth = () => {
    signInWithPopup(auth, provider)
      .then((result) => {
        document.getElementById('login-btn').innerText = "Logged In";
        alert("Welcome " + result.user.displayName + "!");
      })
      .catch((error) => alert("Login Error: " + error.message));
  };
</script>
