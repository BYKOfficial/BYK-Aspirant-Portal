<!DOCTYPE html>
<html lang="en" id="html-root" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>BYK All Exam — Elite Student Super-App</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --bg: #0B0F19; --bg-surface: #111827; --bg-elevated: #1F2937; --text-main: #F8FAFC; --text-muted: #94A3B8; --border: rgba(255, 255, 255, 0.1); --accent: #6366F1; --glass-bg: rgba(17, 24, 39, 0.7); }
  body { background-color: var(--bg); color: var(--text-main); font-family: sans-serif; }
  .glass-panel { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 1.25rem; }
  .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; margin: 0.25rem 0.5rem; border-radius: 0.8rem; color: var(--text-muted); cursor: pointer; }
  .nav-item:hover { background: var(--bg-elevated); color: white; }
  .nav-item.active { background: rgba(99, 102, 241, 0.2); color: var(--accent); }
  .page-section { display: none; }
  .page-section.active { display: block; }
</style>
</head>
<body class="flex min-h-screen">

  <aside id="sidebar" class="w-64 border-r border-white/10 flex flex-col bg-[#111827]">
    <div class="p-6 font-bold text-xl">BYK<span class="text-indigo-400">Exam</span></div>
    <div class="flex-1 overflow-y-auto" id="nav-container">
       <div class="nav-item active" onclick="navigate('home')">🏠 Dashboard</div>
    </div>
  </aside>

  <div class="flex-1 flex flex-col">
    <header class="p-6 flex justify-between items-center border-b border-white/10 bg-[#0B0F19]/80 backdrop-blur-md sticky top-0">
      <h2 id="current-page-title" class="text-xl font-bold">Dashboard</h2>
      <div class="flex gap-3">
        <button id="login-btn" onclick="handleAuth()" class="bg-indigo-600 px-4 py-2 rounded-lg text-xs font-bold hover:bg-indigo-700 transition">
          Login with Google
        </button>
        <button onclick="toggleTheme()" class="p-2 rounded-lg border border-white/10">🌙</button>
      </div>
    </header>
    
    <main class="p-8">
      <div id="page-home" class="page-section active glass-panel p-12 text-center">
        <h1 class="text-5xl font-black mb-6">Stop Scanning.<br/><span class="text-indigo-400">Start Scoring.</span></h1>
        <p class="text-gray-400">Elite AI-powered portal for your success.</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDt57DdiTxlLIHK0vkl5IwW1RL9o3DUe3k",
      authDomain: "byk-all-exam.firebaseapp.com",
      projectId: "byk-all-exam",
      storageBucket: "byk-all-exam.firebasestorage.app",
      messagingSenderId: "413565314858",
      appId: "1:413565314858:web:c614e57ed60c47a5b32053"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Login Function
    window.handleAuth = () => {
      signInWithPopup(auth, provider)
        .then((res) => {
            updateUI(res.user);
        })
        .catch((err) => {
            console.error(err);
            alert("Error: " + err.message);
        });
    };

    function updateUI(user) {
      document.getElementById('login-btn').innerText = "Hi, " + user.displayName.split(' ')[0];
    }

    onAuthStateChanged(auth, (user) => {
      if (user) updateUI(user);
    });

    // Theme logic
    window.toggleTheme = () => {
        document.getElementById('html-root').classList.toggle('dark');
    };
    
    // Simple Navigation mock
    window.navigate = (page) => {
        document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
        document.getElementById('page-'+page).classList.add('active');
    };
  </script>
</body>
</html>
