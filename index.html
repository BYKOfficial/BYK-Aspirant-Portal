<!DOCTYPE html>
<html lang="en" id="html-root" class="dark">
<head>
<!-- ... (Aapka original CSS aur Meta tags wahi rahenge) ... -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<!-- (Maine aapka original CSS yahan include maan liya hai) -->
</head>
<body class="flex min-h-screen">

  <!-- Header ke liye updated topbar (Login button ke saath) -->
  <header class="sticky top-0 z-40 backdrop-blur-xl border-b border-white/10 w-full p-4 flex justify-between items-center bg-gray-900/80">
    <div class="text-lg font-bold">BYK<span class="text-indigo-400">Exam</span></div>
    
    <!-- Login Button added here -->
    <button id="login-btn" onclick="handleAuth()" class="bg-indigo-600 px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-indigo-700">
      Login with Google
    </button>
  </header>

  <!-- (Baaki aapka poora Dashboard aur Sidebar code yahan rahega) -->

  <!-- Firebase Auth script add kar raha hoon -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDt57DdiTxlLIHK0vkl5IwW1RL9o3DUe3k",
      authDomain: "byk-all-exam.firebaseapp.com",
      projectId: "byk-all-exam",
      storageBucket: "byk-all-exam.firebasestorage.app",
      messagingSenderId: "413565314858",
      appId: "1:413565314858:web:c614e57ed60c47a5b32053"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.handleAuth = () => {
      signInWithPopup(auth, provider)
        .then((res) => {
          document.getElementById('login-btn').innerText = "Logged In: " + res.user.displayName.split(' ')[0];
          alert("Welcome " + res.user.displayName);
        })
        .catch((err) => alert("Login Error: " + err.message));
    };

    onAuthStateChanged(auth, (user) => {
      if (user) document.getElementById('login-btn').innerText = "Logged In: " + user.displayName.split(' ')[0];
    });
  </script>
</body>
</html>
