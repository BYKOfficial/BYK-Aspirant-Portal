<!DOCTYPE html>
<html lang="en" id="html-root" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>BYK All Exam — Elite Student Super-App</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] } } } }
</script>
<style>
  :root { --bg: #0B0F19; --bg-surface: #111827; --text-main: #F8FAFC; --accent: #6366F1; --border: rgba(255, 255, 255, 0.1); --glass-bg: rgba(17, 24, 39, 0.7); }
  body { background-color: var(--bg); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; }
  .glass-panel { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 1.25rem; }
  .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; margin: 0.25rem 0.5rem; border-radius: 0.8rem; color: #94A3B8; cursor: pointer; }
  .nav-item:hover { background: #1F2937; color: white; }
  .btn-primary { background: linear-gradient(135deg, #6366F1, #4F46E5); color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 600; }
  .page-section { display: none; }
  .page-section.active { display: block; }
</style>
</head>
<body class="flex min-h-screen">

  <!-- Sidebar -->
  <aside class="w-64 border-r border-white/10 bg-[#111827] flex flex-col">
    <div class="p-6 font-bold text-xl text-indigo-400">BYK Exam</div>
    <nav class="flex-1 p-2">
      <div class="nav-item">🏠 Dashboard</div>
      <div class="nav-item">📋 UPSC CSE</div>
      <div class="nav-item">⚡ Mock Engine</div>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col">
    <!-- Header with Login -->
    <header class="p-6 flex justify-between items-center border-b border-white/10 sticky top-0 bg-[#0B0F19]/80 backdrop-blur-md">
      <h2 id="current-page-title" class="text-xl font-bold">Dashboard</h2>
      <button id="login-btn" onclick="handleAuth()" class="btn-primary">Login with Google</button>
    </header>
    
    <main class="p-8">
      <div id="page-home" class="page-section active glass-panel p-12 text-center">
        <h1 class="text-5xl font-black mb-6">Stop Scanning.<br/><span class="text-indigo-400">Start Scoring.</span></h1>
        <p class="text-gray-400">Welcome to your elite dashboard.</p>
      </div>
    </main>
  </div>

  <!-- Firebase Auth Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDt57DdiTxlLIHK0vkl5IwW1RL9o3DUe3k",
      authDomain: "byk-all-exam.firebaseapp.com",
      projectId: "byk-all-exam",
      storageBucket: "byk-all-exam.firebasestorage.app",
      messagingSenderId: "413565314858",
      appId: "1:413565314858:web:c614e57ed60c47a5b32053"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.handleAuth = () => {
      signInWithPopup(auth, provider)
        .then((res) => {
          document.getElementById('login-btn').innerText = "Logged In: " + res.user.displayName.split(' ')[0];
          alert("Welcome " + res.user.displayName);
        })
        .catch((err) => alert("Login Error: " + err.message));
    };
  </script>
</body>
</html>
